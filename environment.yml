name: physionet2026
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # Wissenschaftliche Basis
  - conda-forge::numpy
  - conda-forge::scipy=1.11.4
  - conda-forge::blas=*=openblas
  - pandas=2.1.4
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - h5py>=3.9.0
  - joblib>=1.3.0
  - tqdm>=4.66.0

  # Machine Learning
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - lightgbm>=4.1.0
  - neurokit2
  - pyedflib

  # Pip-only Pakete
  - pip
  - pip:
    - mne>=1.6.0
    - pyarrow

    # Feature-Extraktion
    - antropy>=0.1.6
    - yasa>=0.6.4

    # Datenverarbeitung
    - polars>=0.20.0

    # Imbalanced Learning
    - imbalanced-learn>=0.11.0

    # Logging
    - loguru>=0.7.0

    # ONNX Model Inference (für LSTM-Modell-Laden in CAP-Pipeline)
    - onnxruntime
